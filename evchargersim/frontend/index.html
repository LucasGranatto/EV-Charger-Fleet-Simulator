<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVChargerSim — Painel de Controle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">⚡</span>
      <div class="brand-text">
        <h1>EVChargerSim</h1>
        <p class="brand-sub">Painel de controle · OCPP 1.6J</p>
      </div>
    </div>
    <div class="stats-strip" id="stats-strip"><!-- preenchido por app.js --></div>
  </header>

  <main>
    <div class="controls-row">
      <div class="add-charger-row">
        <input type="text" id="new-charger-id" placeholder="ID novo, ou lista: CH01, CH02, CH03">
        <button id="add-charger-btn">+ Adicionar</button>
      </div>
      <div class="search-row">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input type="text" id="search-input" placeholder="Filtrar por ID">
      </div>
    </div>

    <div id="grid"></div>
  </main>

  <div class="modal-overlay" id="confirm-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <p id="confirm-title"></p>
      <div class="modal-actions">
        <button id="confirm-cancel">Cancelar</button>
        <button id="confirm-ok" class="danger">Remover</button>
      </div>
    </div>
  </div>

  <div class="toast-stack" id="toast-stack"></div>

  <script src="app.js"></script>
</body>
</html>
